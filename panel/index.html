<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Painel de Trabalho</title>
    <link rel="stylesheet" href="painel.css" />
  </head>
  <body>
    <section class="pomo" id="pomodoro" data-fase="parado">
      <div id="pomoAnel" class="pomo-anel"></div>
      <div class="pomo-info">
        <span class="fase" id="pomoFase"><i></i><span data-i18n="pomodoro">Pomodoro</span></span>
        <input id="pomoRotulo" class="rotulo" type="text" maxlength="120" data-i18n-placeholder="focoPlaceholder" data-i18n-aria-label="focoPlaceholder" />
        <div class="bts">
          <button id="pomoPrincipal" class="bt p" data-i18n="iniciarFoco">Start focus</button>
          <button id="pomoPular" class="bt" data-i18n="pular" data-i18n-title="pularTitulo" hidden>Skip</button>
          <button id="pomoParar" class="bt ic" data-i18n-title="parar" data-i18n-aria-label="parar" hidden>■</button>
        </div>
      </div>
    </section>

    <nav class="seg">
      <div class="s" role="tablist" data-i18n-aria-label="periodo">
        <button data-tipo="dia" class="on" data-i18n="dia">Day</button>
        <button data-tipo="semana" data-i18n="semana">Week</button>
        <button data-tipo="mes" data-i18n="mes">Month</button>
      </div>
      <div class="nav">
        <button id="anterior" class="ic" data-i18n-aria-label="periodoAnterior" data-i18n-title="periodoAnterior">‹</button>
        <span id="rotuloPeriodo" class="num"></span>
        <button id="proximo" class="ic" data-i18n-aria-label="proximoPeriodo" data-i18n-title="proximoPeriodo" disabled>›</button>
        <button id="atualizar" class="ic" data-i18n-aria-label="atualizar" data-i18n-title="atualizar">↻</button>
      </div>
    </nav>

    <nav class="abas" role="tablist">
      <button data-aba="resumo" class="on"><span data-i18n="resumo">Summary</span></button>
      <button data-aba="sessoes"><span data-i18n="sessoes">Sessions</span> <span class="n" id="nSessoes"></span></button>
      <button data-aba="commits"><span data-i18n="commits">Commits</span> <span class="n" id="nCommits"></span></button>
      <button data-aba="tarefas"><span data-i18n="tarefas">Tasks</span> <span class="n" id="nTarefas"></span></button>
    </nav>

    <main>
      <div id="status" class="status" hidden></div>

      <section data-painel="resumo">
        <div class="kpis" id="kpis"></div>

        <div class="bloco">
          <div class="cab"><h3 data-i18n="ondeFoiTempo"></h3><small data-i18n="tempoAtivoMin"></small></div>
          <div class="donut"><div id="donut"></div><div class="leg" id="legenda"></div></div>
        </div>

        <div class="bloco">
          <div class="cab">
            <h3 id="tituloBarras"></h3>
            <select id="metrica" class="seletor" data-i18n-aria-label="metricaGrafico">
              <option value="minutos" data-i18n="tempoAtivo"></option>
              <option value="custo" data-i18n="custoEstimado"></option>
              <option value="focoMin" data-i18n="foco"></option>
              <option value="commits" data-i18n="commits"></option>
              <option value="tokens" data-i18n="tokens"></option>
            </select>
          </div>
          <div id="barras"></div>
          <div class="dica num" id="dica"></div>
        </div>

        <div class="bloco">
          <div class="cab"><h3 data-i18n="ultimasSessoes"></h3><button class="link" id="verSessoes" data-i18n="verTodas"></button></div>
          <div class="lista" id="ultimasSessoes"></div>
        </div>

        <div class="bloco">
          <div class="cab"><h3 data-i18n="modelos"></h3><small id="tokensTotal" class="num"></small></div>
          <div class="lista" id="modelos"></div>
        </div>

        <p class="nota" data-i18n="nota"></p>
      </section>

      <section data-painel="sessoes" hidden><div class="lista" id="sessoes"></div></section>
      <section data-painel="commits" hidden><div class="lista" id="commits"></div></section>

      <section data-painel="tarefas" hidden>
        <form id="novaTarefa" class="nova-tarefa">
          <input id="textoTarefa" class="campo" type="text" maxlength="300" data-i18n-placeholder="novaTarefa" data-i18n-aria-label="novaTarefa" autocomplete="off" />
          <button class="bt p" type="submit" data-i18n="adicionar"></button>
        </form>
        <ul id="tarefas" class="tarefas"></ul>
        <button id="limparFeitas" class="link" data-i18n="limparConcluidas" hidden></button>
        <div class="bloco" id="concluidasPeriodo"></div>
      </section>
    </main>

    <script src="i18n.js"></script>
    <script src="painel.js"></script>
  </body>
</html>
