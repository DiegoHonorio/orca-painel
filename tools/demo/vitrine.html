<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <title>Vitrine do Painel de Trabalho</title>
    <!-- Monta a capa e os prints do catálogo (1600×1000) com o painel de demonstração em iframes.
         ?modo=capa|resumo|historico|foco -->
    <style>
      @font-face { font-family: 'Geist'; src: url('../../panel/fonts/geist-latin-wght-normal.woff2') format('woff2'); font-weight: 100 900; }
      @font-face { font-family: 'Geist Mono'; src: url('../../panel/fonts/geist-mono-latin-wght-normal.woff2') format('woff2'); font-weight: 100 900; }
      :root { --bg: #0e1015; --fg: #e6e8ec; --mut: #8c93a1; --acc: #7c8cff; --line: #2a2e37; }
      * { box-sizing: border-box; }
      html, body { margin: 0; width: 1600px; height: 1000px; overflow: hidden; background: var(--bg); color: var(--fg); font-family: 'Geist', system-ui, sans-serif; }
      body { background: radial-gradient(90% 80% at 0% 0%, #1d2140 0%, transparent 60%), radial-gradient(70% 70% at 100% 100%, #152a2a 0%, transparent 60%), var(--bg); }
      .palco { position: absolute; inset: 0; display: grid; grid-template-columns: 560px 1fr; gap: 56px; padding: 80px 72px; align-items: center; }
      .texto { display: grid; gap: 22px; align-content: center; }
      .marca { display: flex; align-items: center; gap: 14px; font-size: 20px; font-weight: 600; color: var(--mut); }
      .marca img { width: 52px; height: 52px; }
      h1 { margin: 0; font-size: 58px; line-height: 1.04; letter-spacing: -0.03em; font-weight: 700; text-wrap: balance; }
      h1 em { font-style: normal; color: var(--acc); }
      p { margin: 0; font-size: 21px; line-height: 1.5; color: var(--mut); max-width: 30ch; }
      ul { margin: 0; padding: 0; list-style: none; display: grid; gap: 12px; font-size: 19px; }
      li { display: flex; gap: 12px; align-items: baseline; }
      li::before { content: ''; flex: none; width: 8px; height: 8px; border-radius: 2px; background: var(--acc); transform: translateY(-2px); }
      li:nth-child(2)::before { background: #4cc3c3; }
      li:nth-child(3)::before { background: #e0a458; }
      li:nth-child(4)::before { background: #d17ad6; }
      .selo { display: inline-flex; gap: 8px; align-items: center; font-family: 'Geist Mono', monospace; font-size: 14px; color: var(--mut); border: 1px solid var(--line); border-radius: 999px; padding: 6px 14px; width: fit-content; }
      .telas { display: flex; gap: 28px; justify-content: center; align-items: flex-start; height: 100%; }
      .tela { width: 380px; height: 840px; border-radius: 16px; overflow: hidden; border: 1px solid #323858; box-shadow: 0 40px 80px -30px rgba(0, 0, 0, 0.7), 0 0 0 6px rgba(124, 140, 255, 0.05); flex: none; background: #15171c; }
      .tela.baixa { margin-top: 70px; }
      .tela iframe { width: 380px; height: 840px; border: 0; display: block; }
    </style>
  </head>
  <body>
    <div class="palco">
      <div class="texto" id="texto"></div>
      <div class="telas" id="telas"></div>
    </div>
    <script>
      const modos = {
        capa: {
          titulo: 'Veja <em>no que você trabalhou</em>, sem sair do Orca.',
          sub: 'Tempo ativo, tokens, custo, commits e pomodoro por dia, semana e mês. Tudo lido da sua própria máquina.',
          lista: [],
          telas: ['tipo=semana', 'tipo=dia&aba=sessoes&pomo=pausa']
        },
        resumo: {
          titulo: 'Seu dia, semana e mês num relance.',
          sub: '',
          lista: ['Tempo ativo dos agentes, sem contar em dobro os que rodam em paralelo', 'Onde foi o tempo, projeto por projeto', 'Custo estimado e tokens por modelo', 'Comparação com o período anterior'],
          telas: ['tipo=semana', 'tipo=mes&metrica=custo&pomo=parado']
        },
        historico: {
          titulo: 'Cada sessão e cada commit, no lugar certo.',
          sub: '',
          lista: ['Sessões do Claude Code e do Codex com título, projeto e branch', 'Seus commits em todos os repositórios', 'Worktrees somam no mesmo projeto', 'Histórico guardado mesmo depois que as transcrições são apagadas'],
          telas: ['tipo=semana&aba=sessoes&pomo=parado', 'tipo=semana&aba=commits&pomo=parado']
        },
        foco: {
          titulo: 'Pomodoro e tarefas junto do seu código.',
          sub: '',
          lista: ['Pomodoro no painel e na barra de status do Orca', 'Notificação no fim de cada foco e pausa', 'Lista de tarefas que entra no relatório', 'Tempo de foco hora a hora, ao lado dos agentes'],
          telas: ['tipo=dia&aba=tarefas&pomo=foco', 'tipo=dia&pomo=pausa&metrica=focoMin']
        }
      }
      const modo = modos[new URLSearchParams(location.search).get('modo') || 'capa']
      const texto = document.getElementById('texto')
      texto.innerHTML = `<div class="marca"><img src="../../media/icon.png" alt="">Painel de Trabalho · plugin do Orca</div><h1>${modo.titulo}</h1>`
      if (modo.sub) texto.insertAdjacentHTML('beforeend', `<p>${modo.sub}</p>`)
      if (modo.lista.length) texto.insertAdjacentHTML('beforeend', `<ul>${modo.lista.map((i) => `<li>${i}</li>`).join('')}</ul>`)
      texto.insertAdjacentHTML('beforeend', '<span class="selo">100% local · sem rede · sem rastreamento</span>')
      document.getElementById('telas').innerHTML = modo.telas
        .map((q, i) => `<div class="tela${i === 1 ? ' baixa' : ''}"><iframe src="demo.html?${q}" title="Painel de demonstração"></iframe></div>`)
        .join('')
    </script>
  </body>
</html>
